[project]
name = "wmx"
version = "0.1.0"
description = "This project explores world model policy exploitations"
readme = "README.md"
authors = [
    { name = "Arnav Verma", email = "arnavverma522@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.5",
  "numpy>=1.26",
  "gymnasium[mujoco]>=1.0",
  "pyyaml>=6.0",
  "crafter>=1.8",
  "minari[hf]>=0.5",        # VERIFY: extra needed to download the Farama datasets
  "gym-pusht>=0.1",
  "transformers>=4.45",     # Qwen2.5 text world model
  "accelerate",
  "wandb",
  "pandas",
  "pyarrow",
  "scipy",
  "matplotlib",
  "tqdm",
]

[project.scripts]
world-model-exploitation = "wmx:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "wmx", from = "src" }]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
